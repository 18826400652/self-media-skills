<!--
  Broadside — caption skin (preset-local source).

  This is the preset's own lower-third karaoke caption look. product-launch-video's
  Step 2 copies it into the project as caption-skin.html; captions.mjs then fills the
  three reserved holes, wraps the fragment in a <template>, and writes
  compositions/captions.html:
    · the empty GROUPS array            → the engine's scene-aware word groups
    · the 0 duration + 0 width/height   → real total + canvas size
    · the empty data-brand-tokens style → :root tokens derived from the project's frame.md

  Token contract — reference ONLY this fixed vocab (captions.mjs injects it from
  frame.md, so the Step-2 brand overlay flows through; each var has a broadside literal
  fallback for standalone preview):
    --cap-ink · --cap-canvas · --cap-accent · --cap-accent-2 · --font-display ·
    --font-body · --cap-band-top · --cap-band-height
  Hooks (do not rename): .caption-group / .caption-word + states .is-active / .is-spoken,
  root data-composition-id="captions", timeline at window.__timelines["captions"].
  State changes use gsap.set({className}) (applied on the engine's frame-by-frame seek);
  never tl.call() callbacks (seek does not fire them → wrong state on render).

  Visual（glow）：半透明深色圆角衬底（不要硬底板），900 粗白字带深色阴影；还没说到的词半透明，重点词说到时变荧光黄并发光。
-->
<script src="compositions/kit/gsap.min.js"></script>

<!-- captions.mjs injects the project's :root tokens here -->
<style data-brand-tokens></style>
<style>
  :root {
    --cap-douyin-top: 1180px;
    --cap-douyin-height: 260px;
  }
</style>

<style>
  #captions-root {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .caption-layer {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
  }
  /* the keep-out band, from captionBand(H) — frame content stays above it */
  .caption-stage {
    position: absolute;
    left: 0;
    right: 0;
    /* 抖音版：字幕带上移到 y 1180–1440，避开抖音底部 480px 的标题文案区 */
    top: var(--cap-douyin-top, var(--cap-band-top, 900px));
    height: var(--cap-douyin-height, var(--cap-band-height, 180px));
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .caption-group {
    /* every group is absolutely stacked over the SAME band — exactly one shown at a
       time via opacity. Must be absolute: in-flow groups would lay out side-by-side. */
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
  }

  /* THE ink-black plate — single 1px fire-orange hairline (broadside's lone accent),
     SHARP corners (0 radius), NO shadow (the plane is flat) */
  /* glow 版：不要硬底板，只留一层半透明深色圆角衬底 + 粗白字阴影；
     黄底的冲击帧上，荧光黄重点词也靠这层衬底看得清 */
  .caption-pill {
    max-width: 80%;
    padding: 6px 30px 10px;
    background: rgb(10 10 12 / 0.55);
    border: 0;
    border-radius: 22px;
  }
  .caption-line {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.04em 0; /* 中文：段与段之间不留空格 */
    font-family: var(--font-display, "Barlow"), system-ui, sans-serif;
    font-weight: 900;
    font-size: 60px;
    line-height: 1.3;
    letter-spacing: 0;
    text-transform: none;
    text-wrap: balance; /* 多行时每行字数平均，避免最后一行只剩一两个字 */
    -webkit-font-smoothing: antialiased; /* 中文粗体灰度抗锯齿，边缘更干净 */
    text-rendering: optimizeLegibility;
    text-shadow: 0 4px 18px rgb(0 0 0 / 0.9), 0 0 2px rgb(0 0 0 / 0.8);
  }

  /* upcoming — faint cream, no block (massive lowercase Barlow 900 as graphic primitive) */
  .caption-word {
    display: inline-block;
    text-wrap: balance; /* 一个分句太长、在块内折行时也平均分行 */
    padding: 0 0.08em;
    color: color-mix(in srgb, var(--cap-canvas, #f0ece5) 45%, transparent);
  }
  /* current word — THE register flip: a hard flat fire-orange block (box-shadow spread =
     a sharp rectangle w/o layout shift; no blur), ink reading on top — the lone accent */
  .caption-word.is-active {
    color: var(--cap-canvas, #f0ece5);
  }
  /* 重点词（字幕「词」以 * 开头）：说到时变荧光黄并发光，说完保持荧光黄 */
  .caption-word.cap-key.is-active,
  .caption-word.cap-key.is-spoken {
    color: var(--cap-accent, #e85d26);
    background: none;
    box-shadow: none;
    text-shadow: 0 4px 18px rgb(0 0 0 / 0.9), 0 0 28px color-mix(in srgb, var(--cap-accent, #e85d26) 55%, transparent);
  }
  /* already spoken — solid cream, the orange block cleared */
  .caption-word.is-spoken {
    color: var(--cap-canvas, #f0ece5);
    background: transparent;
    box-shadow: none;
  }

  /* optional per-word accents (dormant until a word-classer tags them) */
  /* brand / key term — fire-orange ink, the cream-on-ink register's only inflection */
  .caption-word.cap-brand {
    color: var(--cap-accent, #e85d26);
  }
  /* numerals / data — the IBM Plex Mono chrome voice, uppercase + tracked, recessed */
  .caption-word.cap-num {
    font-family: var(--font-body, "IBM Plex Mono"), ui-monospace, monospace;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: color-mix(in srgb, var(--cap-canvas, #f0ece5) 72%, var(--cap-ink, #111111));
  }
  /* emphasis — a fire-orange hairline underline (no second hue; the lone accent again) */
  .caption-word.cap-cta {
    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-decoration-color: var(--cap-accent-2, #e85d26);
    text-underline-offset: 0.1em;
  }

  @media (max-aspect-ratio: 9/16) {
    .caption-pill {
      max-width: 92%;
    }
    .caption-line {
      font-size: 64px; /* 竖屏手机上中文字幕要大 */
    }
  }
</style>

<div
  id="captions-root"
  data-composition-id="captions"
  data-timeline-locked
  data-start="0"
  data-duration="0"
  data-fps="30"
  data-width="0"
  data-height="0"
>
  <div class="caption-layer" aria-hidden="true">
    <div id="caption-stage" class="caption-stage"></div>
  </div>
</div>

<script>
  // captions.mjs injects the engine's scene-aware groups + real duration here.
  var GROUPS = [];
  var DURATION = 0;

  (function () {
    var stage = document.getElementById("caption-stage");

    // build DOM: one .caption-group per group, .caption-word per word
    GROUPS.forEach(function (group, g) {
      var groupEl = document.createElement("div");
      groupEl.className = "caption-group";
      groupEl.id = "caption-group-" + g;
      var pill = document.createElement("div");
      pill.className = "caption-pill";
      var line = document.createElement("div");
      line.className = "caption-line";
      (group.words || []).forEach(function (w, i) {
        var span = document.createElement("span");
        var raw = String(w.text);
        w.key = raw.charAt(0) === "*";
        span.className = "caption-word" + (w.key ? " cap-key" : "");
        span.id = "caption-word-" + g + "-" + i;
        // 显示时去掉重点词标记和句末标点（抖音字幕习惯不带标点）
        span.textContent = raw.replace(/^\*/, "").replace(/[,.;:!?]+$/, "");
        line.appendChild(span);
      });
      pill.appendChild(line);
      groupEl.appendChild(pill);
      stage.appendChild(groupEl);
    });

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    GROUPS.forEach(function (group, g) {
      var groupEl = document.getElementById("caption-group-" + g);
      var words = group.words || [];
      var next = GROUPS[g + 1];
      var isLast = g === GROUPS.length - 1;
      var start = Math.max(0, Number(group.start));
      var end = isLast ? DURATION : Math.min(Number(next.start), Number(group.end) + 0.3);
      if (end <= start) end = start + 0.01;

      // group on/off — exactly one group visible at a time
      tl.set(groupEl, { opacity: 1 }, start);
      tl.set(groupEl, { opacity: 0 }, end);

      // 3-state karaoke via className SETS — seek-safe (gsap.set applies on the
      // engine's frame-by-frame seek; .call callbacks would NOT fire).
      words.forEach(function (w, i) {
        var el = document.getElementById("caption-word-" + g + "-" + i);
        var at = Math.max(start, Number(w.start));
        var base = "caption-word" + (w.key ? " cap-key" : "");
        tl.set(el, { className: base }, start); // upcoming (also resets on reverse-seek)
        tl.set(el, { className: base + " is-active" }, at); // current
        tl.fromTo(el, { scale: 0.92 }, { scale: 1, duration: 0.1, ease: "power3.out" }, at);
        if (i + 1 < words.length) {
          var nextAt = Math.max(start, Number(words[i + 1].start));
          tl.set(el, { className: base + " is-spoken" }, nextAt); // demote when next activates
        }
      });
      if (words.length) {
        var lastEl = document.getElementById("caption-word-" + g + "-" + (words.length - 1));
        var lastSpoken = Math.min(end, Number(words[words.length - 1].end) + 0.1);
        var lastBase = "caption-word" + (words[words.length - 1].key ? " cap-key" : "");
        tl.set(lastEl, { className: lastBase + " is-spoken" }, lastSpoken);
      }
    });

    // full-span anchor so the sub-comp timeline spans the whole video
    tl.to({}, { duration: DURATION }, 0);
    window.__timelines["captions"] = tl;
  })();
</script>
