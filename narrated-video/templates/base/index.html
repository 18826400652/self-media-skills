<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{WIDTH}}, height={{HEIGHT}}" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="preset.css" />
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="components.css" />
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <!--
      时间轴约定（nv sync 自动维护，不要手改这些时间）：
      - 场景用 data-lines="2" 或 data-lines="2-4" 绑定 脚本.md 的分镜行号，
        sync 会写入 data-start / data-duration。
      - 字幕在 captions 标记之间自动生成（#cap-1、#cap-2 ……）。
      - #root 和 #voice 的时长也由 sync 写入。
      - 动画用 data-enter / data-at / data-fx 声明，组件见 components.css（目录见 SKILL.md）。
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="{{WIDTH}}"
      data-height="{{HEIGHT}}"
    >
      <audio id="voice" src="audio/voice.wav" data-start="0" data-duration="10"></audio>
      <!-- 音效轨：nv sync 按 脚本.md「音效」列生成，不要手改 -->
      <!-- sfx:start -->
      <!-- sfx:end -->

      <!-- 场景 1：钩子 · 标题卡（中文大标题用 <br /> 手动断行） -->
      <section id="s1" class="clip scene" data-lines="1" data-start="0" data-duration="3">
        <h1 class="hero" data-enter="up">一句话<br /><mark data-enter="mark" data-at="+0.5">抓住注意力</mark></h1>
      </section>

      <!-- 场景 2：干货 · 要点列表 -->
      <section id="s2" class="clip scene" data-lines="2-4" data-start="3" data-duration="5">
        <ol class="list point">
          <li data-enter="left" data-at="2"><span class="num">01</span><span>第一个要点</span></li>
          <li data-enter="left" data-at="3"><span class="num">02</span><span>第二个要点</span></li>
          <li data-enter="left" data-at="4"><span class="num">03</span><span>第三个要点</span></li>
        </ol>
      </section>

      <!-- 场景 3：收尾 -->
      <section id="s3" class="clip scene" data-lines="5" data-start="8" data-duration="2">
        <p class="hero" data-enter="up">感谢<mark data-enter="mark" data-at="+0.5">观看</mark></p>
        <p class="note" data-enter="up" data-at="+0.2">关注我，下期见</p>
      </section>

      <!-- captions:start -->
      <!-- captions:end -->
    </div>

    <script src="components.js"></script>
    <script>
      // 动画用 data-enter / data-at / data-fx 声明（见 components.js），nvAnimate 自动生成。
      // 组件之外的特殊动画写在下面，可用 nvAt("s2")、nvLine(3) 取时间。
      const tl = nvAnimate(gsap.timeline({ paused: true }));

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
